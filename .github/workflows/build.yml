name: Build

# Website, server tests and server deploy. The APK has its own workflow (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    # the website (site/) on GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build static binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o navi-server .
      - uses: actions/upload-artifact@v4
        with:
          name: navi-server
          path: server/navi-server

  deploy-server:
    # pushes to main go live on the Pelican panel (needs the PELICAN_API_KEY secret)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: server
    runs-on: ubuntu-latest
    env:
      PANEL: https://panel.taymaerz.de
      SERVER: ${{ vars.PELICAN_SERVER_ID || 'ae7b9822' }}
      KEY: ${{ secrets.PELICAN_API_KEY }}
    steps:
      - name: Skip without key
        if: env.KEY == ''
        run: echo "PELICAN_API_KEY not set – skipping deploy"
      - uses: actions/download-artifact@v4
        if: env.KEY != ''
        with:
          name: navi-server
      - name: Upload and restart
        if: env.KEY != ''
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $KEY" -H "Accept: application/json")
          api="$PANEL/api/client/servers/$SERVER"
          url=$(curl -fsS "${auth[@]}" "$api/files/upload" | jq -r .attributes.url)
          curl -fsS -o /dev/null -F "files=@navi-server" "$url&directory=/"
          curl -fsS -o /dev/null "${auth[@]}" -H "Content-Type: application/json" -X POST "$api/files/chmod" \
            -d '{"root":"/","files":[{"file":"navi-server","mode":"755"}]}'
          curl -fsS -o /dev/null "${auth[@]}" -H "Content-Type: application/json" -X POST "$api/power" -d '{"signal":"restart"}'
          echo "deployed"
